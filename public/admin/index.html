<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content — Rahat Hasan</title>
    <!--
      Point Decap at the config by absolute path. Without this it resolves
      "config.yml" relative to the current URL, so /admin (no trailing slash)
      asks for /config.yml, gets the SPA's index.html back, and dies with a
      YAML syntax error. Neither the dev server nor Vercel redirects /admin
      to /admin/, so both URLs have to work.
    -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Decap CMS. It reads config.yml next to this file, edits the JSON in
      /content, and commits straight to GitHub — so publishing a case study is
      a commit, the host rebuilds, and the prerendered pages and sitemap are
      regenerated with it.

      Swapping to Sveltia CMS later is a one-line change: the config format is
      the same, only this script tag differs.
    -->
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  </body>
</html>
